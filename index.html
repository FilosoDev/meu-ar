<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objeto de Aprendizagem AR - Painel Traseiro da CPU</title>

    <!-- Bibliotecas A-Frame e AR.js -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* BANNER SUPERIOR COM INSTRUÇÕES */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            color: #ffffff;
            padding: 12px;
            text-align: center;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            border-bottom: 2px solid #3b82f6;
        }

        header h1 {
            font-size: 1.1rem;
            margin-bottom: 3px;
            color: #60a5fa;
        }

        header p {
            font-size: 0.82rem;
            opacity: 0.9;
        }

        /* CARD POPUP INFORMATIVO */
        .info-card {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 1000;
            display: none;
            border-left: 6px solid #2563eb;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translate(-50%, 20px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        .info-tag {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 12px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .info-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
        }

        .info-desc {
            font-size: 0.88rem;
            color: #334155;
            line-height: 1.45;
            margin-bottom: 10px;
        }

        .info-spec {
            font-size: 0.82rem;
            color: #1e293b;
            background: #f8fafc;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }

        .btn-close {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #f1f5f9;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            color: #64748b;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-close:hover {
            background: #e2e8f0;
            color: #0f172a;
        }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #0f172a;
            color: #94a3b8;
            text-align: center;
            padding: 6px;
            font-size: 0.75rem;
            z-index: 1000;
        }
    </style>
</head>
<body style="margin: 0px; overflow: hidden;">

    <header>
        <h1>🖥️ Realidade Aumentada - Painel Traseiro da CPU</h1>
        <p>Aponte a câmera para o marcador <strong>HIRO</strong> e toque nas esferas numeradas</p>
    </header>

    <!-- CARD POPUP DE DETALHES DAS PORTAS -->
    <div id="info-card" class="info-card">
        <button class="btn-close" onclick="fecharInfo()">✕</button>
        <span id="card-tag" class="info-tag">Porta</span>
        <div id="card-title" class="info-title">Nome da Porta</div>
        <div id="card-desc" class="info-desc">Descrição técnica.</div>
        <div id="card-spec" class="info-spec">⚡ <strong>Recurso Técnico:</strong> <span id="card-speed">-</span></div>
    </div>

    <!-- CENA AR (A-FRAME) -->
    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false;"
        cursor="rayOrigin: mouse" 
        raycaster="objects: .clickable">

        <a-assets>
            <!-- Carregamento do Modelo 3D de Computador (GLTF/GLB) -->
            <a-asset-item id="pc-model" src="https://raw.githack.com/KhronosGroup/glTF-Sample-Assets/main/Models/Computer/glTF-Binary/Computer.glb"></a-asset-item>
        </a-assets>

        <!-- MARCADOR HIRO -->
        <a-marker preset="hiro">

            <!-- GRUPO DO MODELO 3D + HOTSPOTS -->
            <a-entity position="0 0 0" rotation="0 0 0" scale="0.8 0.8 0.8">

                <!-- Gabinete 3D em Realidade Aumentada -->
                <a-entity 
                    gltf-model="#pc-model" 
                    position="0 0 0" 
                    rotation="0 180 0" 
                    scale="1.5 1.5 1.5">
                </a-entity>

                <!-- HOTSPOTS INTERATIVOS (PONTOS DE CLIQUE) POSICIONADOS NO PAINEL TRASEIRO -->

                <!-- 1. Fonte de Alimentação (Energia) -->
                <a-sphere class="clickable" onclick="exibirInfo('fonte')" position="0 1.2 -0.3" radius="0.12" color="#ef4444" opacity="0.85">
                    <a-text value="1" position="0 0 0.15" align="center" scale="1.2 1.2 1.2" color="#ffffff"></a-text>
                </a-sphere>

                <!-- 2. Portas de Vídeo (HDMI / DisplayPort) -->
                <a-sphere class="clickable" onclick="exibirInfo('video')" position="-0.25 0.6 -0.3" radius="0.12" color="#eab308" opacity="0.85">
                    <a-text value="2" position="0 0 0.15" align="center" scale="1.2 1.2 1.2" color="#ffffff"></a-text>
                </a-sphere>

                <!-- 3. Portas USB (Periféricos e Dados) -->
                <a-sphere class="clickable" onclick="exibirInfo('usb')" position="0.25 0.6 -0.3" radius="0.12" color="#3b82f6" opacity="0.85">
                    <a-text value="3" position="0 0 0.15" align="center" scale="1.2 1.2 1.2" color="#ffffff"></a-text>
                </a-sphere>

                <!-- 4. Rede Ethernet (RJ-45) -->
                <a-sphere class="clickable" onclick="exibirInfo('rede')" position="-0.25 0.2 -0.3" radius="0.12" color="#10b981" opacity="0.85">
                    <a-text value="4" position="0 0 0.15" align="center" scale="1.2 1.2 1.2" color="#ffffff"></a-text>
                </a-sphere>

                <!-- 5. Conectores de Áudio (P2/Jack) -->
                <a-sphere class="clickable" onclick="exibirInfo('audio')" position="0.25 0.2 -0.3" radius="0.12" color="#ec4899" opacity="0.85">
                    <a-text value="5" position="0 0 0.15" align="center" scale="1.2 1.2 1.2" color="#ffffff"></a-text>
                </a-sphere>

            </a-entity>

        </a-marker>

        <!-- CÂMERA -->
        <a-entity camera></a-entity>
    </a-scene>

    <footer>
        Objeto de Aprendizagem AR | Marcador Hiro
    </footer>

    <script>
        // BASE DE DADOS DOS CONECTORES TRASEIROS
        const CONECTORES = {
            fonte: {
                categoria: "Alimentação Elétrica",
                nome: "Entrada da Fonte (AC Power)",
                descricao: "Conecta o cabo de força tripolar à fonte de alimentação para suprir energia elétrica a todos os componentes internos da CPU.",
                especificacao: "Tensões: 110V / 220V AC (Frequência: 50/60Hz)"
            },
            video: {
                categoria: "Saída de Vídeo / Exibição",
                nome: "Portas HDMI & DisplayPort",
                descricao: "Enviam sinais digitais de áudio e vídeo de alta definição para monitores, TVs ou projetores.",
                especificacao: "Suporte a resoluções Full HD, 4K e altas taxas de atualização (Hz)"
            },
            usb: {
                categoria: "Barramento Universal (E/S)",
                nome: "Portas USB 3.0 / 3.2",
                descricao: "Utilizadas para conectar periféricos como teclado, mouse, pen drives, HDs externos e impressoras.",
                especificacao: "Taxas de transferência de até 5 Gbps (USB 3.0) ou 10 Gbps (USB 3.2)"
            },
            rede: {
                categoria: "Conectividade de Rede",
                nome: "Porta RJ-45 (Ethernet LAN)",
                descricao: "Permite a conexão física via cabo de rede UTP ao roteador ou switch para acesso à internet e redes locais.",
                especificacao: "Padrão Gigabit Ethernet (10/100/1000 Mbps)"
            },
            audio: {
                categoria: "Entrada e Saída de Áudio",
                nome: "Conectores Jack P2 (3.5mm)",
                descricao: "Portas analógicas para som: Verde (Saída de Áudio/Caixas de som), Rosa (Microfone) e Azul (Entrada de Linha/Auxiliar).",
                especificacao: "Sinal de Áudio Analógico Estéreo"
            }
        };

        function exibirInfo(chave) {
            const dados = CONECTORES[chave];
            if (!dados) return;

            document.getElementById('card-tag').innerText = dados.categoria;
            document.getElementById('card-title').innerText = dados.nome;
            document.getElementById('card-desc').innerText = dados.descricao;
            document.getElementById('card-speed').innerText = dados.especificacao;

            document.getElementById('info-card').style.display = 'block';
        }

        function fecharInfo() {
            document.getElementById('info-card').style.display = 'none';
        }
    </script>
</body>
</html>
