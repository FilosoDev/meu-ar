<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realidade Aumentada - WebAR no PC</title>

    <!-- Bibliotecas Necessárias para RA na Web -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* PAINEL DE INSTRUÇÃO E MARCADOR NA TELA */
        #ar-instructions {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            z-index: 1000;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            max-width: 90%;
        }

        #ar-instructions h2 {
            margin: 0 0 5px 0;
            font-size: 1rem;
            color: #38bdf8;
        }

        #ar-instructions p {
            margin: 0;
            font-size: 0.8rem;
            color: #cbd5e1;
        }

        /* EXIBE O MARCADOR HIRO NO CANTO PARA FACILITAR OS TESTES */
        #hiro-preview {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: #fff;
            padding: 5px;
            border-radius: 6px;
            z-index: 1000;
            text-align: center;
            border: 2px solid #38bdf8;
        }

        #hiro-preview img {
            width: 100px;
            height: 100px;
            display: block;
        }

        #hiro-preview span {
            font-size: 0.65rem;
            color: #000;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- INSTRUÇÕES PARA O USUÁRIO -->
    <div id="ar-instructions">
        <h2>🎥 Realidade Aumentada Ativa</h2>
        <p>Aponte a webcam para o marcador <strong>HIRO</strong> (veja no canto inferior direito ou abra no celular).</p>
    </div>

    <!-- MINIATURA DO MARCADOR PARA TESTAR SE NÃO TIVER IMPRESSO -->
    <div id="hiro-preview">
        <img src="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png" alt="Marcador Hiro">
        <span>Abra essa imagem no celular e aponte a webcam!</span>
    </div>

    <!-- CENÁRIO DE REALIDADE AUMENTADA -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix;">
        
        <!-- ELEMENTOS 3D QUE VÃO APARECER EM CIMA DO MARCADOR "HIRO" -->
        <a-marker preset="hiro">
            
            <!-- Anel Giratório -->
            <a-torus position="0 0.5 0" radius="0.6" radius-tubular="0.05" color="#f97316"
                     animation="property: rotation; to: 360 360 0; loop: true; dur: 4000; easing: linear">
            </a-torus>

            <!-- Cubo Central -->
            <a-box position="0 0.5 0" material="opacity: 0.8; color: #38bdf8;" scale="0.6 0.6 0.6"
                   animation="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear">
            </a-box>

            <!-- Texto 3D flutuante -->
            <a-text value="LEAN AR" position="-0.6 1.3 0" color="#22c55e" scale="1.2 1.2 1.2"></a-text>

        </a-marker>

        <!-- Câmera do Sistema -->
        <a-entity camera></a-entity>

    </a-scene>

</body>
</html>
