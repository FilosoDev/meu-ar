<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Traseiro da CPU em Realidade Aumentada</title>

    <!-- Bibliotecas A-Frame e AR.js -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        /* BANNER SUPERIOR COM INSTRUÇÕES */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            color: #ffffff;
            padding: 12px;
            text-align: center;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            border-bottom: 2px solid #3b82f6;
        }

        header h1 {
            font-size: 1.1rem;
            margin-bottom: 3px;
            color: #60a5fa;
        }

        header p {
            font-size: 0.82rem;
            opacity: 0.9;
        }

        /* CARD POPUP INFORMATIVO DO CONECTOR */
        .info-card {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 1000;
            display: none;
            border-left: 6px solid #2563eb;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translate(-50%, 20px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        .info-tag {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 12px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .info-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
        }

        .info-desc {
            font-size: 0.88rem;
            color: #334155;
            line-height: 1.45;
            margin-bottom: 10px;
        }

        .info-spec {
            font-size: 0.82rem;
            color: #1e293b;
            background: #f8fafc;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }

        .btn-close {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #f1f5f9;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            color: #64748b;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-close:hover {
            background: #e2e8f0;
            color: #0f172a;
        }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #0f172a;
            color: #94a3b8;
            text-align: center;
            padding: 6px;
            font-size: 0.75rem;
            z-index: 1000;
        }
    </style>
</head>
<body style="margin: 0px; overflow: hidden;">

    <header>
        <h1>🖥️ Painel Traseiro da CPU (I/O Shield)</h1>
        <p>Aponte para o marcador <strong>HIRO</strong> e toque em qualquer porta para inspecionar</p>
    </header>

    <!-- POPUP COM INFORMAÇÕES TÉCNICAS DA PORTA -->
    <div id="info-card" class="info-card">
        <button class="btn-close" onclick="fecharInfo()">✕</button>
        <span id="card-tag" class="info-tag">Porta</span>
        <div id="card-title" class="info-title">Nome do Conector</div>
        <div id="card-desc" class="info-desc">Descrição funcional.</div>
        <div id="card-spec" class="info-spec">⚡ <strong>Especificação:</strong> <span id="card-speed">-</span></div>
    </div>

    <!-- CENA AR -->
    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false;"
        cursor="rayOrigin: mouse" 
        raycaster="objects: .clickable">

        <!-- MARCADOR HIRO -->
        <a-marker preset="hiro">

            <!-- ESTRUTURA DO ESPELHO/PAINEL TRASEIRO DA CPU -->
            <a-entity position="0 0 0" rotation="-90 0 0" scale="1.2 1.2 1.2">

                <!-- 1. PLACA BASE DO ESPELHO METALIZADO (I/O SHIELD) -->
                <a-box position="0 0 -0.05" width="1.6" height="3.4" depth="0.08" color="#94a3b8" material="metalness: 0.8; roughness: 0.2"></a-box>
                <a-plane position="0 0 0" width="1.5" height="3.3" color="#1e293b"></a-plane>

                <!-- CONECTOR PS/2 (TECLADO/MOUSE LEGADO) -->
                <a-entity class="clickable" onclick="exibirInfo('ps2')" position="-0.35 1.2 0.08">
                    <a-cylinder radius="0.16" height="0.12" color="#9333ea" rotation="90 0 0">
                        <a-cylinder radius="0.12" height="0.13" color="#16a34a" rotation="0 0 0"></a-cylinder>
                    </a-cylinder>
                    <a-text value="PS/2" position="0 -0.25 0" align="center" scale="0.5 0.5 0.5" color="#ffffff"></a-text>
                </a-entity>

                <!-- PORTA DE VÍDEO VGA (AZUL - DB15) -->
                <a-entity class="clickable" onclick="exibirInfo('vga')" position="0.35 1.2 0.08">
                    <a-box width="0.45" height="0.22" depth="0.12" color="#2563eb">
                        <a-text value="VGA" position="0 0 0.07" align="center" scale="0.4 0.4 0.4" color="#ffffff"></a-text>
                    </a-box>
                </a-entity>

                <!-- PORTA DE VÍDEO HDMI (DIGITAL DOURADA) -->
                <a-entity class="clickable" onclick="exibirInfo('hdmi')" position="-0.35 0.6 0.08">
                    <a-box width="0.45" height="0.18" depth="0.12" color="#d97706">
                        <a-text value="HDMI" position="0 0 0.07" align="center" scale="0.4 0.4 0.4" color="#ffffff"></a-text>
                    </a-box>
                </a-entity>

                <!-- PORTA DISPLAYPORT -->
                <a-entity class="clickable" onclick="exibirInfo('displayport')" position="0.35 0.6 0.08">
                    <a-box width="0.45" height="0.18" depth="0.12" color="#475569">
                        <a-text value="DP" position="0 0 0.07" align="center" scale="0.4 0.4 0.4" color="#ffffff"></a-text>
                    </a-box>
                </a-entity>

                <!-- PORTAS USB 3.0 (DUPLA AZUL) -->
                <a-entity class="clickable" onclick="exibirInfo('usb3')" position="-0.35 0.0 0.08">
                    <a-box position="0 0.1 0" width="0.42" height="0.18" depth="0.12" color="#0284c7"></a-box>
                    <a-box position="0 -0.1 0" width="0.42" height="0.18" depth="0.12" color="#0284c7"></a-box>
                    <a-text value="USB 3.0" position="0 -0.26 0" align="center" scale="0.4 0.4 0.4" color="#38bdf8"></a-text>
                </a-entity>

                <!-- PORTA REDE ETHERNET (RJ-45) + USB 2.0 -->
                <a-entity class="clickable" onclick="exibirInfo('rede')" position="0.35 0.0 0.08">
                    <a-box position="0 0.12" width="0.45" height="0.22" depth="0.15" color="#b45309">
                        <a-text value="LAN" position="0 0 0.08" align="center" scale="0.4 0.4 0.4" color="#ffffff"></a-text>
                    </a-box>
                    <a-box position="0 -0.1" width="0.42" height="0.16" depth="0.12" color="#334155"></a-box>
                </a-entity>

                <!-- PORTAS DE ÁUDIO JACK P2 (VERDE, ROSA, AZUL) -->
                <a-entity class="clickable" onclick="exibirInfo('audio')" position="0 -0.8 0.08">
                    <!-- Áudio Saída (Verde) -->
                    <a-cylinder position="0 0.3 0" radius="0.11" height="0.1" color="#22c55e" rotation="90 0 0"></a-cylinder>
                    <!-- Microfone (Rosa) -->
                    <a-cylinder position="-0.35 0 0" radius="0.11" height="0.1" color="#ec4899" rotation="90 0 0"></a-cylinder>
                    <!-- Entrada de Linha (Azul) -->
                    <a-cylinder position="0.35 0 0" radius="0.11" height="0.1" color="#3b82f6" rotation="90 0 0"></a-cylinder>
                    <a-text value="AUDIO P2" position="0 -0.22 0" align="center" scale="0.4 0.4 0.4" color="#ffffff"></a-text>
                </a-entity>

                <!-- FONTE DE ALIMENTAÇÃO (CONECTOR TRIPOULAR AC) -->
                <a-entity class="clickable" onclick="exibirInfo('fonte')" position="0 -1.3 0.08">
                    <a-box width="0.9" height="0.3" depth="0.12" color="#0f172a">
                        <a-text value="ENTRADA DE ENERGIA (AC)" position="0 0 0.07" align="center" scale="0.35 0.35 0.35" color="#ef4444"></a-text>
                    </a-box>
                </a-entity>

            </a-entity>

        </a-marker>

        <!-- CÂMERA -->
        <a-entity camera></a-entity>
    </a-scene>

    <footer>
        Objeto de Aprendizagem AR | I/O Shield CPU
    </footer>

    <script>
        // BASE DE DADOS TÉCNICA DE CADA CONECTOR REAL DA CPU
        const CONECTORES = {
            ps2: {
                categoria: "Conector Legado",
                nome: "Porta PS/2 Combo",
                descricao: "Conector circular de 6 pinos para teclado (roxo) e mouse (verde).",
                especificacao: "Comunicação via interrupção direta de hardware"
            },
            vga: {
                categoria: "Saída de Vídeo Analógica",
                nome: "Porta VGA (DB-15)",
                descricao: "Transmite sinal analógico de vídeo para monitores antigos e projetores.",
                especificacao: "Resolução máxima recomendada: 1920x1080 (Full HD)"
            },
            hdmi: {
                categoria: "Saída de Vídeo & Áudio Digital",
                nome: "Porta HDMI",
                descricao: "Transmite sinais digitais não comprimidos de vídeo e áudio num único cabo.",
                especificacao: "Suporte a 4K, HDR e canais de áudio multicanal"
            },
            displayport: {
                categoria: "Saída de Vídeo de Alta Performance",
                nome: "DisplayPort (DP)",
                descricao: "Padrão de exibição digital focado em monitores de alta taxa de atualização.",
                especificacao: "Suporta tecnologia G-Sync/FreeSync e resoluções 4K/8K"
            },
            usb3: {
                categoria: "Barramento Serial Universal",
                nome: "Portas USB 3.0 / 3.2 (Azul)",
                descricao: "Portas de alta velocidade para pendrives, HDs externos e periféricos modernos.",
                especificacao: "Velocidade de transferência: 5 Gbps a 10 Gbps"
            },
            rede: {
                categoria: "Rede Física",
                nome: "Porta RJ-45 (Ethernet Network)",
                descricao: "Conecta a CPU à rede local e internet através de cabos de par trançado.",
                especificacao: "Padrão Gigabit Ethernet (10/100/1000 Mbps)"
            },
            audio: {
                categoria: "Interface de Som Analógica",
                nome: "Painel de Áudio P2 (3.5mm)",
                descricao: "Verde: Saída de som (Fones/Caixas) | Rosa: Entrada de Microfone | Azul: Line-In (Entrada auxiliar).",
                especificacao: "Sinais de áudio analógico estéreo/Surround"
            },
            fonte: {
                categoria: "Alimentação Elétrica",
                nome: "Conector Triplo AC (Fonte)",
                descricao: "Entrada do cabo de força vindo da tomada para alimentar a fonte do gabinete.",
                especificacao: "Tensão de 110V/220V AC com pino de aterramento"
            }
        };

        function exibirInfo(chave) {
            const dados = CONECTORES[chave];
            if (!dados) return;

            document.getElementById('card-tag').innerText = dados.categoria;
            document.getElementById('card-title').innerText = dados.nome;
            document.getElementById('card-desc').innerText = dados.descricao;
            document.getElementById('card-speed').innerText = dados.especificacao;

            document.getElementById('info-card').style.display = 'block';
        }

        function fecharInfo() {
            document.getElementById('info-card').style.display = 'none';
        }
    </script>
</body>
</html>
